# Publish each docs/releases/v<version>.md that has no release yet as a GitHub Release, tagged at the merge commit,
# when it reaches main. No session pushes a tag. See docs/RELEASES.md.
name: Release

on:
  push:
    branches: [main]
    paths: ['docs/releases/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    # A workflow_dispatch on another branch publishes nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notes pass the check
        run: node scripts/release-notes.mjs check
      - name: Publish the notes files that have no release
        run: node scripts/release-notes.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
