name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Scrub check
        run: npm run scrub
      - name: marketplace.json is up to date
        run: node scripts/build-marketplace.mjs --check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code 2.1.302
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Plugin manifests pass claude plugin validate --strict
        run: claude plugin validate . --strict
