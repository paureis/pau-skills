name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # keep: Tests fails when ROSTER_LOCK_BASE gives no base commit, so it needs full history
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
        # The base for tests/geppetto-roster-lock-base.test.mjs. On a pull request HEAD is the merge commit and HEAD^1
        # is the base branch tip; on a push to main it is the previous main, which covers multi-commit pushes. When it
        # gives no base commit (it does not resolve, or LOCK is not there) this step fails, so fetch-depth 0 must stay.
        env:
          ROSTER_LOCK_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
      - name: Scrub check
        run: npm run scrub
      - name: marketplace.json is up to date
        run: node scripts/build-marketplace.mjs --check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code 2.1.302
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Plugin manifests pass claude plugin validate --strict
        run: claude plugin validate . --strict
