name: Bug report
description: A skill or hook did something wrong.
labels: [bug]
body:
  - type: input
    id: piece
    attributes:
      label: Which skill or hook?
      placeholder: e.g. destructive-guard, flaky-test-hunt
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a hook, include the command or edit it blocked or let through.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version` and `claude plugin list`, plus your OS.
